plugins {
    id 'java'
    id 'application'  // enables the 'run' task and distribution packaging
    id 'eclipse'      // allows dependencies to be exported to .classpath
    id 'com.github.johnrengelman.shadow' version '7.1.2'  // fat JAR (Domino JARs excluded – see below)
}

archivesBaseName = 'DominoBlueprint'
mainClassName = 'net.prominic.dominoblueprint.DominoBlueprint'

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
    }
}

// ---------------------------------------------------------------------------
// Notes / Domino installation discovery
// ---------------------------------------------------------------------------

String notesInstallation = project.findProperty('notesInstallation') ?: '/Applications/HCL Notes.app/Contents/MacOS/'
if (!notesInstallation) {
    throw new GradleException("Missing configured path for Notes installation.  Set notesInstallation in gradle.properties.")
} else if (!(new File(notesInstallation).exists())) {
    throw new GradleException("Invalid configured path for Notes installation ($notesInstallation).  Check notesInstallation in gradle.properties.")
}

String notesJarBaseDir = notesInstallation
String envPath = System.getenv('PATH') ?: ''

// macOS puts extra JARs one level up from the MacOS directory
if (notesInstallation.toLowerCase().startsWith('/applications/')) {
    notesJarBaseDir = "$notesInstallation/.."
} else { // Windows / Linux
    envPath = "$envPath;$notesInstallation"
    println "Updated PATH: $envPath"
}

/**
 * Recursively find a file under baseDir. If multiple copies exist, the last
 * one found wins (consistent with the behaviour in DXLImporter-Gradle-Demo).
 */
String findFile(String baseDir, String findName) {
    String foundFile = null
    new File(baseDir).eachFileRecurse { File curFile ->
        if (curFile.getName() == findName) {
            foundFile = curFile.getAbsolutePath()
            println "Found file '$findName' at '${curFile.getAbsolutePath()}'"
        }
    }
    if (!foundFile) {
        println("Could not find '$findName' in '$baseDir'")
    }
    return foundFile
}

// ---------------------------------------------------------------------------
// Resolve the licensed HCL Domino JARs once.
//
// These JARs are required to COMPILE and RUN, but must NOT be bundled into the
// distributed artifact (they are licensed HCL JARs that should not travel
// between systems).  The same detected paths feed both the compileOnly
// dependencies (below) and the executable-jar manifest Class-Path, so the jar
// finds them at runtime without being shipped inside it.
//
//   - Notes.jar             : required (core Domino classes)
//   - websvc.jar            : required – the native DxlExporter.NexportDxl() /
//                             DxlImporter.NimportDxl() load lotus.domino.websvc.* /
//                             axis.* / ws.* when handling agents and script libraries
//   - lwpd.domino.napi.jar  : optional (present in Domino 12.0.2+ installs)
//   - lwpd.commons.jar      : optional (present in Domino 12.0.2+ installs)
// ---------------------------------------------------------------------------

List<String> dominoJarNames = ['Notes.jar', 'lwpd.domino.napi.jar', 'lwpd.commons.jar', 'websvc.jar']
Map<String, String> dominoJarPaths = [:]
dominoJarNames.each { String jarName ->
    String found = findFile(notesJarBaseDir, jarName)
    dominoJarPaths[jarName] = found
    if (!found) {
        logger.warn "Domino JAR '$jarName' not found under '$notesJarBaseDir'; it will be omitted from the manifest Class-Path."
    }
}

if (!dominoJarPaths['Notes.jar']) {
    throw new GradleException("Required 'Notes.jar' not found under '$notesJarBaseDir'. Check notesInstallation in gradle.properties.")
}
if (!dominoJarPaths['websvc.jar']) {
    logger.warn "'websvc.jar' not found – exporting/importing Java agents or script libraries will fail at runtime (native code loads lotus.domino.websvc.* / axis.* / ws.*)."
}

// Encode an absolute path for a manifest Class-Path entry: spaces -> %20, and prefix a leading
// Windows drive letter (e.g. C:) with '/' so it forms a valid file reference.
Closure<String> manifestEntry = { String path -> path.replaceAll(' ', '%20').replaceAll('^\\w+:', '/$0') }

// For each Domino JAR, list it both alongside the executable jar (./name, e.g. when copied for
// deployment) and at its detected absolute location, so the jar runs whether the Domino JARs sit
// next to it or only in the installation directory.
List<String> classPathEntries = []
dominoJarNames.each { String jarName ->
    classPathEntries << "./$jarName"
    if (dominoJarPaths[jarName]) {
        classPathEntries << manifestEntry(dominoJarPaths[jarName])
    }
}
String jarClassPath = classPathEntries.join(' ')

// Domino JARs as a FileCollection, for the dev JavaExec tasks below (compileOnly deps are not on
// the runtime classpath, so they must be added back explicitly to actually run from Gradle).
FileCollection dominoRuntimeFiles = files(dominoJarPaths.values().findAll { it != null })

// ---------------------------------------------------------------------------
// Java compatibility
// ---------------------------------------------------------------------------

sourceCompatibility = 1.8
targetCompatibility = 1.8

// ---------------------------------------------------------------------------
// Dependencies
//
// The Domino JARs are declared compileOnly so they are available on the compile
// classpath but are NOT placed on the runtime configuration that Shadow bundles.
// This keeps the licensed JARs out of the distributed fat jar; they are supplied
// at runtime via the manifest Class-Path (jarClassPath) instead.
// ---------------------------------------------------------------------------

dependencies {
    compileOnly files(dominoJarPaths['Notes.jar'])
    if (dominoJarPaths['websvc.jar'])           compileOnly files(dominoJarPaths['websvc.jar'])
    if (dominoJarPaths['lwpd.domino.napi.jar']) compileOnly files(dominoJarPaths['lwpd.domino.napi.jar'])
    if (dominoJarPaths['lwpd.commons.jar'])     compileOnly files(dominoJarPaths['lwpd.commons.jar'])
}

// ---------------------------------------------------------------------------
// Fat JAR – produced by the Shadow plugin
//
// Bundles the project's own classes (and any non-Domino runtime deps).  The
// licensed Domino JARs are intentionally EXCLUDED (declared compileOnly above)
// and supplied at runtime via the manifest Class-Path: each JAR is listed both
// as ./<name> (when copied next to the jar) and at its detected absolute install
// location.  The Domino *native* libraries (.so / .dylib / .dll) still need to be
// on LD_LIBRARY_PATH / DYLD_LIBRARY_PATH – use run.sh, which handles this.
//
// Build:  gradle shadowJar   (or simply: gradle build)
// Run:    java -jar build/libs/DominoBlueprint.jar <export|createdb|import> [options]
// ---------------------------------------------------------------------------

// Disable the thin jar – we only want the (shaded) fat jar
jar.enabled = false

shadowJar {
    archiveFileName = 'DominoBlueprint.jar'   // keep the same name regardless of version

    manifest {
        attributes 'Main-Class': mainClassName,
                   'Class-Path': jarClassPath   // licensed Domino JARs supplied at runtime, not bundled
    }

    mergeServiceFiles()   // handle duplicate META-INF/services across bundled JARs
}

// 'gradle build' and 'gradle assemble' both produce the fat jar
assemble.dependsOn shadowJar

// ---------------------------------------------------------------------------
// Convenience Gradle tasks for development / CI
//
// One task per subcommand, each dispatching through the single DominoBlueprint
// entry point.  All argument validation/assembly is deferred to doFirst{} so
// other tasks (e.g. 'clean', 'shadowJar') are never affected by missing -P flags.
//
//   runExporter  – export  (-Pserver -PdbName -PoutputDir)
//   runCreateDb  – createdb (-Pserver -PdbName)
//   runImport    – import  (-Pserver -PdbName -PdxlInput [-PaclImport])
//
// Password: -PnotesIDPassword=<pw> OR the PASSWORD environment variable.
// ---------------------------------------------------------------------------

// Apply a Notes ID password to a JavaExec task via the PASSWORD env var and stdin
// (Domino's native password reader reads stdin before our Java runs).
Closure applyPassword = { JavaExec task ->
    String notesIDPassword = task.project.findProperty('notesIDPassword') ?: System.getenv('PASSWORD') ?: ''
    if (notesIDPassword) {
        task.environment('PASSWORD', notesIDPassword)
        task.standardInput = new java.io.ByteArrayInputStream("${notesIDPassword}\n".getBytes('UTF-8'))
    } else {
        task.standardInput = new java.io.ByteArrayInputStream("".getBytes('UTF-8'))
    }
}

task runExporter(type: JavaExec, dependsOn: classes) {
    // compileOnly Domino JARs are not on runtimeClasspath, so add them back to actually run.
    classpath = sourceSets.main.runtimeClasspath + dominoRuntimeFiles
    mainClass = mainClassName
    environment('DYLD_LIBRARY_PATH', notesInstallation)
    environment('LD_LIBRARY_PATH',   notesInstallation)
    environment('PATH', envPath)
    errorOutput = System.out
    doFirst {
        String server    = project.findProperty('server')    ?: ''
        String dbName    = project.findProperty('dbName')    ?: ''
        String outputDir = project.findProperty('outputDir') ?: './export'
        if (!dbName) {
            throw new GradleException("Database name is required.  Add -PdbName=<database.nsf>.")
        }
        applyPassword(delegate)
        args 'export', '--server', server, '--database', dbName, '--output', outputDir
    }
}

task runCreateDb(type: JavaExec, dependsOn: classes) {
    classpath = sourceSets.main.runtimeClasspath + dominoRuntimeFiles
    mainClass = mainClassName
    environment('DYLD_LIBRARY_PATH', notesInstallation)
    environment('LD_LIBRARY_PATH',   notesInstallation)
    environment('PATH', envPath)
    errorOutput = System.out
    doFirst {
        String server = project.findProperty('server') ?: ''
        String dbName = project.findProperty('dbName') ?: ''
        if (!dbName) {
            throw new GradleException("Database name is required.  Add -PdbName=<database.nsf>.")
        }
        applyPassword(delegate)
        args 'createdb', '--server', server, '--database', dbName
    }
}

task runImport(type: JavaExec, dependsOn: classes) {
    classpath = sourceSets.main.runtimeClasspath + dominoRuntimeFiles
    mainClass = mainClassName
    environment('DYLD_LIBRARY_PATH', notesInstallation)
    environment('LD_LIBRARY_PATH',   notesInstallation)
    environment('PATH', envPath)
    errorOutput = System.out
    doFirst {
        String server   = project.findProperty('server')   ?: ''
        String dbName   = project.findProperty('dbName')   ?: ''
        String dxlInput = project.findProperty('dxlInput') ?: ''
        String aclMode  = project.findProperty('aclImport') ?: ''
        if (!dbName) {
            throw new GradleException("Database name is required.  Add -PdbName=<database.nsf>.")
        }
        if (!dxlInput) {
            throw new GradleException("Import source is required.  Add -PdxlInput=<dxl-file-or-directory>.")
        }
        applyPassword(delegate)
        List<String> a = ['import', '--server', server, '--database', dbName, '--input', dxlInput]
        if (aclMode) { a << "--acl-import=${aclMode}".toString() }
        args(a as Object[])
    }
}
